apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cnpg
spec:
  version: v1.28.1
  homepage: https://github.com/cloudnative-pg/cloudnative-pg
  shortDescription: CloudNativePG kubectl plugin
  description: |
    kubectl plugin for managing CloudNativePG PostgreSQL clusters on Kubernetes.
    
    This plugin provides commands to:
    - Manage PostgreSQL cluster lifecycle
    - Perform backups and restores
    - Monitor cluster status
    - Manage certificates and credentials
    
    Source: https://github.com/cloudnative-pg/cloudnative-pg
    Built from: v1.28.1
    Maintained by: pgEdge
  caveats: |
    This plugin requires the CloudNativePG operator to be installed in your cluster.
    
    For more information, visit: https://cloudnative-pg.io
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.1/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "7aec37ee6f5f65528ab3b620da1c6cfeab52df99e4ee6fd86317a2747bd4d6e9"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.1/kubectl-cnpg-linux-arm64.tar.gz
    sha256: "cf000d9fcc218315f2f28444abebd22ef5f332da850f40d3dbb3035d9ec4e34e"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.1/kubectl-cnpg-darwin-amd64.tar.gz
    sha256: "1d8fcb7e42bd8a7a28c319d0e6d5abc040ccb39aad6ce576eb002d1840a7f0bb"
