apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cnpg
spec:
  version: v1.28.3
  homepage: https://github.com/cloudnative-pg/cloudnative-pg
  shortDescription: CloudNativePG kubectl plugin
  description: |
    kubectl plugin for managing CloudNativePG PostgreSQL clusters on Kubernetes.
    
    This plugin provides commands to:
    - Manage PostgreSQL cluster lifecycle
    - Perform backups and restores
    - Monitor cluster status
    - Manage certificates and credentials
    
    Source: https://github.com/cloudnative-pg/cloudnative-pg
    Built from: v1.28.3
    Maintained by: pgEdge
  caveats: |
    This plugin requires the CloudNativePG operator to be installed in your cluster.
    
    For more information, visit: https://cloudnative-pg.io
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.3/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "b72a4095559c4c933ed5b16d0ee80a7a1b95f77b3c3bd2eaf2bc8415b6500902"
    bin: kubectl-cnpg
