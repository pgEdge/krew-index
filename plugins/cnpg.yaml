    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.1/kubectl-cnpg-darwin-arm64.tar.gz
    sha256: "c35b4784daa300cdaeda6daa75e60eb0d43b81b4703be921e29e05e060d22af3"
