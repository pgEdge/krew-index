      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.2/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "b48e5a5027c3ce4e165ba510e1cb165eb168983402b0678c99edc4a90f81a481"
    bin: kubectl-cnpg
