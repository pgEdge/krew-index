apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cnpg
spec:
  version: v1.28.0
  homepage: https://github.com/cloudnative-pg/cloudnative-pg
  shortDescription: CloudNativePG kubectl plugin
  description: |
    kubectl plugin for managing CloudNativePG PostgreSQL clusters on Kubernetes.
    
    This plugin provides commands to:
    - Manage PostgreSQL cluster lifecycle
    - Perform backups and restores
    - Monitor cluster status
    - Manage certificates and credentials
    
    Source: https://github.com/cloudnative-pg/cloudnative-pg
    Built from: v1.28.0
    Maintained by: pgEdge
  caveats: |
    This plugin requires the CloudNativePG operator to be installed in your cluster.
    
    For more information, visit: https://cloudnative-pg.io
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "da8cbc8223c5b71ee94b08790e836b55f39a9b57a38027ec6fd8ec53888d78f2"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-linux-arm64.tar.gz
    sha256: "113ae3b6ca0c56640e8df213cdda577621a6dc3d78d38cd35a990c9558dee174"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-darwin-amd64.tar.gz
    sha256: "3299961522ab85a54c30124afb4bc833d2b1f3ab631655803535a27642a1c2b2"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
