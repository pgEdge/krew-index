apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cnpg
spec:
  version: v1.29.1
  homepage: https://github.com/cloudnative-pg/cloudnative-pg
  shortDescription: CloudNativePG kubectl plugin
  description: |
    kubectl plugin for managing CloudNativePG PostgreSQL clusters on Kubernetes.
    
    This plugin provides commands to:
    - Manage PostgreSQL cluster lifecycle
    - Perform backups and restores
    - Monitor cluster status
    - Manage certificates and credentials
    
    Source: https://github.com/cloudnative-pg/cloudnative-pg
    Built from: v1.29.1
    Maintained by: pgEdge
  caveats: |
    This plugin requires the CloudNativePG operator to be installed in your cluster.
    
    For more information, visit: https://cloudnative-pg.io
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.1/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "86bf9eaaad50e1bd9ef437be5febeded937a2a3c7457cb07414d6e7158ad82bb"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.1/kubectl-cnpg-linux-arm64.tar.gz
    sha256: "6d5f69a9ced12d9ff811ef3bac747f9544ab9979aadb2e7125685bd371647324"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.1/kubectl-cnpg-darwin-amd64.tar.gz
    sha256: "20b434345ce2ea239658724b5d79cd525d48c0bb058cabe1c163fce1be46d138"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
