apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cnpg
spec:
  version: v1.30.0
  homepage: https://github.com/cloudnative-pg/cloudnative-pg
  shortDescription: CloudNativePG kubectl plugin
  description: |
    kubectl plugin for managing CloudNativePG PostgreSQL clusters on Kubernetes.
    
    This plugin provides commands to:
    - Manage PostgreSQL cluster lifecycle
    - Perform backups and restores
    - Monitor cluster status
    - Manage certificates and credentials
    
    Source: https://github.com/cloudnative-pg/cloudnative-pg
    Built from: v1.30.0
    Maintained by: pgEdge
  caveats: |
    This plugin requires the CloudNativePG operator to be installed in your cluster.
    
    For more information, visit: https://cloudnative-pg.io
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.30.0/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "ae9bf7d47ccb1d513710837c1de4ad399cb141b6a6fc4d5690a611d02f214b92"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.30.0/kubectl-cnpg-linux-arm64.tar.gz
    sha256: "812b9b7d2c6bd920ee1f156f9960db3b8163eac207d436b19a6530b7ee7443b6"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.30.0/kubectl-cnpg-darwin-amd64.tar.gz
    sha256: "17fb5ad5b92f35da85b5b09a1ef5a3caccf64cbf4c2a7e6c4fd5c503f19e4059"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.30.0/kubectl-cnpg-darwin-arm64.tar.gz
    sha256: "63c0eed3e70451eca4f191cc064da3e084461c9bce3be74acbc42ab649810f1e"
