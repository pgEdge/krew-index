apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cnpg
spec:
  version: v1.29.0
  homepage: https://github.com/cloudnative-pg/cloudnative-pg
  shortDescription: CloudNativePG kubectl plugin
  description: |
    kubectl plugin for managing CloudNativePG PostgreSQL clusters on Kubernetes.
    
    This plugin provides commands to:
    - Manage PostgreSQL cluster lifecycle
    - Perform backups and restores
    - Monitor cluster status
    - Manage certificates and credentials
    
    Source: https://github.com/cloudnative-pg/cloudnative-pg
    Built from: v1.29.0
    Maintained by: pgEdge
  caveats: |
    This plugin requires the CloudNativePG operator to be installed in your cluster.
    
    For more information, visit: https://cloudnative-pg.io
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.0/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "2387199d874b0fa13686d2c70b4bb96c05ade875d9475c5bb03622bd12da23fb"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.0/kubectl-cnpg-linux-arm64.tar.gz
    sha256: "25dd492e04fa0e06337b5e72369a6a53db4d51a817969c37babb8192f8f6a0d4"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.0/kubectl-cnpg-darwin-amd64.tar.gz
    sha256: "be9ca675bbe5b7defb83d2062bdf1bea55a23318c870a019cffb10b471ae8aa1"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.29.0/kubectl-cnpg-darwin-arm64.tar.gz
    sha256: "04d5750445f1884bc511ad4b039259cbea0db3d512c21116e9f9b93bf05184b2"
