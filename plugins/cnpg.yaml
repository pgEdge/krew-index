apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cnpg
spec:
  version: v1.28.0
  homepage: https://github.com/cloudnative-pg/cloudnative-pg
  shortDescription: CloudNativePG kubectl plugin
  description: |
    kubectl plugin for managing CloudNativePG PostgreSQL clusters on Kubernetes.
    
    This plugin provides commands to:
    - Manage PostgreSQL cluster lifecycle
    - Perform backups and restores
    - Monitor cluster status
    - Manage certificates and credentials
    
    Source: https://github.com/cloudnative-pg/cloudnative-pg
    Built from: v1.28.0
    Maintained by: pgEdge
  caveats: |
    This plugin requires the CloudNativePG operator to be installed in your cluster.
    
    For more information, visit: https://cloudnative-pg.io
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-linux-amd64.tar.gz
    sha256: "e914e4fec56b5a5f479e75ad6d42898d381589968dc07b7893398cb9c3ad7e0c"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-linux-arm64.tar.gz
    sha256: "bbf9e08638e79b58c6fa82975cc6275b1979c145d3c3d6b62a559110bb6e4dfd"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-darwin-amd64.tar.gz
    sha256: "fa73a0ae232f105b2ca796d221f9b9435d04f39d2ef946534ccc7800dc01c43b"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-darwin-arm64.tar.gz
    sha256: "e5455f1915adb00131fa0478b848a1f2c4f40e58ea1e9a4bbacf0825c8016827"
    bin: kubectl-cnpg
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.0/kubectl-cnpg-windows-amd64.zip
    sha256: "72c687d0c6b5af613a4d18528c25d3840be77382c279017b543823736ca47e83"
    bin: kubectl-cnpg.exe
