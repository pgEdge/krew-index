    uri: https://github.com/pgEdge/pgedge-cnpg-dist/releases/download/v1.28.1/kubectl-cnpg-darwin-arm64.tar.gz
    sha256: "a22fbcf714ac39becf3001676d8e393ea5638f2b20cc0722b7161ec701e59104"
